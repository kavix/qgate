apiVersion: v1
kind: ServiceAccount
metadata:
  name: qgate-webhook
  namespace: qgate-system
  labels:
    app.kubernetes.io/name: qgate
    app.kubernetes.io/component: webhook
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: qgate-webhook
  labels:
    app.kubernetes.io/name: qgate
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: qgate-webhook
  labels:
    app.kubernetes.io/name: qgate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: qgate-webhook
subjects:
  - kind: ServiceAccount
    name: qgate-webhook
    namespace: qgate-system
