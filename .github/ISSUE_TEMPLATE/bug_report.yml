name: Bug Report
description: Create a report to help us improve qgate
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `qgate sign ...`
        2. Deploy pod with image digest
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, Go version, Kubernetes version (if applicable).
      placeholder: e.g. Linux amd64, Go 1.23, Kubernetes v1.30
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Output
      description: Include any terminal output or webhook logs.
      render: shell
