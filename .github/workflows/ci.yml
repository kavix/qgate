name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Test & Go Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detection & coverage
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build local binaries
        run: |
          go build -v -o bin/qgate ./cmd/qgate
          go build -v -o bin/webhook ./cmd/webhook

      - name: Verify clean working directory
        run: git diff --exit-code

  docker:
    name: Build Container Images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Webhook Container Image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: webhook
          push: false
          tags: kavix/qgate-webhook:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build qgate CLI Container Image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: qgate
          push: false
          tags: kavix/qgate:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
